name: CI — Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  build-and-test:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Java 17 (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore Copilot.SquadAgent.StickerManager/Copilot.SquadAgent.StickerManager.slnx

      - name: SonarCloud Begin
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"

      - name: Build solution
        run: dotnet build Copilot.SquadAgent.StickerManager/Copilot.SquadAgent.StickerManager.slnx --no-restore --configuration Release

      - name: Run tests with coverage
        run: >
          dotnet test Copilot.SquadAgent.StickerManager/Copilot.SquadAgent.StickerManager.slnx
          --no-build
          --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=./TestResults/
          /p:Threshold=85
          /p:ThresholdType=line
          /p:ThresholdStat=Total

      - name: SonarCloud End
        if: always()
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
