name: Deploy — Staging

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build, Test and SonarCloud Analysis
  # Secrets necessarios:
  #   - SONAR_TOKEN       : token de autenticacao gerado em sonarcloud.io
  # Variaveis necessarias (Settings > Secrets and variables > Variables):
  #   - SONAR_ORGANIZATION: slug da organizacao no SonarCloud (ex: andrecini)
  #   - SONAR_PROJECT_KEY : chave do projeto no SonarCloud (ex: andrecini_sticker-manager)
  # ---------------------------------------------------------------------------
  build-test-analyze:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Java 17 (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore Copilot.SquadAgent.StickerManager.slnx

      - name: SonarCloud Begin
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"

      - name: Build solution
        run: dotnet build Copilot.SquadAgent.StickerManager.slnx --no-restore --configuration Release

      - name: Run tests with coverage
        run: >
          dotnet test Copilot.SquadAgent.StickerManager.slnx
          --no-build
          --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=./TestResults/
          /p:Threshold=85
          /p:ThresholdType=line
          /p:ThresholdStat=Total

      - name: SonarCloud End
        if: always()
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Staging (ilustrativo)
  # Depende de build-test-analyze — so executa se o job anterior passar.
  # Substitua o step de deploy pelo mecanismo adequado ao seu ambiente.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-test-analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish application
        run: >
          dotnet publish Copilot.SquadAgent.StickerManager.slnx
          --configuration Release
          --output ./publish

      - name: Deploy to staging (placeholder)
        run: |
          echo "=========================================="
          echo "  DEPLOY PLACEHOLDER — nao configurado"
          echo "=========================================="
          echo "Build publicado em: ./publish"
          echo "Substitua este step pelo mecanismo de deploy do seu ambiente."
          echo "Commit : ${{ github.sha }}"
          echo "Autor  : ${{ github.actor }}"
          echo "Branch : ${{ github.ref_name }}"
